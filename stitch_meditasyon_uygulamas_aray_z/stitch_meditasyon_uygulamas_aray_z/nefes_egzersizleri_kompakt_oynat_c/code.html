<script>
  (function initBreathFlow() {
    let phase = 0; // 0: Nefes Al (4s), 1: Tut (1s), 2: Nefes Ver (4s)
    let secondsLeft = 4;
    let isPlaying = true;

    const timerEl = document.getElementById('breath-timer');
    const badgeEl = document.getElementById('breath-phase-badge');
    const glowEl = document.getElementById('breath-glow');
    const playBtn = document.getElementById('main-play-btn');
    const playIcon = document.getElementById('play-icon');
    
    const stepInhale = document.getElementById('step-inhale');
    const stepHold = document.getElementById('step-hold');
    const stepExhale = document.getElementById('step-exhale');

    const updateStepStyles = () => {
      const activeClass = ['bg-primary', 'text-on-primary'];
      const passiveClass = ['text-text-secondary'];

      [stepInhale, stepHold, stepExhale].forEach(el => {
        el.classList.remove(...activeClass);
        el.classList.add(...passiveClass);
      });

      if (phase === 0) {
        stepInhale.classList.remove(...passiveClass);
        stepInhale.classList.add(...activeClass);
      } else if (phase === 1) {
        stepHold.classList.remove(...passiveClass);
        stepHold.classList.add(...activeClass);
      } else {
        stepExhale.classList.remove(...passiveClass);
        stepExhale.classList.add(...activeClass);
      }
    };

    const interval = setInterval(() => {
      if (!isPlaying) return;

      secondsLeft--;

      if (secondsLeft <= 0) {
        if (phase === 0) {
          phase = 1;
          secondsLeft = 1;
          badgeEl.textContent = 'Nefesini Tut';
          badgeEl.className = 'px-3 py-1 rounded-full bg-tertiary-container/20 text-tertiary font-label-md text-label-md mb-1';
          if (glowEl) glowEl.className = 'absolute inset-0 rounded-full bg-aura-peach/35 blur-2xl transition-all duration-700 scale-125';
        } else if (phase === 1) {
          phase = 2;
          secondsLeft = 4;
          badgeEl.textContent = 'Yavaşça Ver';
          badgeEl.className = 'px-3 py-1 rounded-full bg-secondary-container/30 text-on-secondary-container font-label-md text-label-md mb-1';
          if (glowEl) glowEl.className = 'absolute inset-0 rounded-full bg-aura-lavender/25 blur-xl transition-all duration-1000 scale-95';
        } else {
          phase = 0;
          secondsLeft = 4;
          badgeEl.textContent = 'Nefes Al';
          badgeEl.className = 'px-3 py-1 rounded-full bg-primary/10 text-primary font-label-md text-label-md mb-1';
          if (glowEl) glowEl.className = 'absolute inset-0 rounded-full bg-gradient-to-tr from-aura-lavender/40 via-aura-peach/30 to-aura-sage/30 blur-2xl transition-all duration-1000 scale-110';
        }
        updateStepStyles();
      }

      if (timerEl) {
        timerEl.textContent = secondsLeft;
      }
    }, 1000);

    if (playBtn && playIcon) {
      playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      });
    }

    // Duration buttons toggle
    const durationBtns = document.querySelectorAll('.duration-btn');
    durationBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        durationBtns.forEach(b => {
          b.className = 'duration-btn px-4 py-1.5 rounded-full font-label-md text-label-md bg-white/70 text-on-surface hover:bg-white active:scale-95 transition-all shadow-sm';
        });
        btn.className = 'duration-btn px-4 py-1.5 rounded-full font-label-md text-label-md bg-primary text-on-primary shadow-sm active:scale-95 transition-all';
      });
    });
  })();
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe px-margin pointer-events-none" data-active-classes="text-primary font-semibold"><div class="pointer-events-auto mx-auto mb-3 max-w-sm h-16 rounded-[28px] bg-white/70 backdrop-blur-2xl shadow-[0_20px_48px_-8px_rgba(30,34,53,0.16)] flex items-center justify-around px-space-md"><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] gap-0.5 text-on-surface-variant hover:text-on-surface transition-all" data-path="ana-sayfa" href="#"><span class="text-[20px] leading-none mb-0.5 select-none">🌿</span><span class="font-label-sm text-label-sm">Ana Sayfa</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] gap-0.5 text-primary font-semibold transition-all" data-path="meditasyon" href="#"><div class="absolute -top-1 w-6 h-1 rounded-full bg-primary/80 blur-[2px]"></div><span class="text-[20px] leading-none mb-0.5 select-none">🧘</span><span class="font-label-sm text-label-sm">Meditasyon</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] gap-0.5 text-on-surface-variant hover:text-on-surface transition-all" data-path="profil" href="#"><span class="text-[20px] leading-none mb-0.5 select-none">👤</span><span class="font-label-sm text-label-sm">Profil</span></a></div></nav>
